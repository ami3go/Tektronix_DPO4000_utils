name: A15 Desk Build (temporary)

on:
  push:
    branches: [a15-recipe-sequencer]

permissions:
  contents: read

env:
  RELEASE_CONSTRAINTS: constraints-release.txt

jobs:
  windows:
    name: A15 Windows Desk smoke build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c $env:RELEASE_CONSTRAINTS -e ".[build,pyside6]"
      - name: Build Windows application folder
        shell: cmd
        env:
          BUILD_SKIP_INSTALL: "1"
        run: scripts\build_windows_exe.bat
      - name: Smoke-test packaged executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path "dist\DPO4000Desk\DPO4000Desk.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--startup-check" -PassThru
          if (-not $process.WaitForExit(15000)) {
            $process.Kill()
            throw "Packaged Windows startup check timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows startup check failed with exit code $($process.ExitCode)."
          }

  linux:
    name: A15 Linux Desk smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install pinned build dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c "${RELEASE_CONSTRAINTS}" -e ".[build,pyside6]"
      - name: Build Linux executable
        env:
          BUILD_SKIP_INSTALL: "1"
        run: bash scripts/build_linux_executable.sh
      - name: Smoke-test packaged binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 20s ./dist/DPO4000Desk/DPO4000Desk --startup-check
