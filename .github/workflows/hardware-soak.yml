name: DPO4000 Hardware Soak

on:
  workflow_dispatch:
    inputs:
      visa_resource:
        description: "VISA resource for the oscilloscope"
        required: true
        default: "USB0::0x0699::0x0401::C011280::INSTR"
      duration_hours:
        description: "Qualification duration"
        required: true
        type: choice
        options:
          - "24"
          - "72"
        default: "24"
      interval_seconds:
        description: "Seconds between read-only cycles"
        required: true
        default: "10"
      max_failures:
        description: "Maximum tolerated failed cycles"
        required: true
        default: "10"
      max_rss_growth_mib:
        description: "Maximum allowed process RSS growth"
        required: true
        default: "256"

jobs:
  soak:
    name: DPO4000 ${{ inputs.duration_hours }}h soak
    runs-on: [self-hosted, dpo4000]
    timeout-minutes: 4440

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver with pinned runtime dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c constraints-release.txt -e .

      - name: Run long-duration read-only qualification
        run: |
          python scripts/run_hardware_soak.py \
            --resource "${{ inputs.visa_resource }}" \
            --duration-hours "${{ inputs.duration_hours }}" \
            --interval-seconds "${{ inputs.interval_seconds }}" \
            --max-failures "${{ inputs.max_failures }}" \
            --max-rss-growth-mib "${{ inputs.max_rss_growth_mib }}" \
            --output-dir "hardware_verification_reports/soak-${{ inputs.duration_hours }}h-${{ github.run_number }}"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpo4000-soak-${{ inputs.duration_hours }}h-${{ github.run_number }}
          path: hardware_verification_reports/
          if-no-files-found: error
          retention-days: 90
