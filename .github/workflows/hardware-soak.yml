name: DPO4000 Hardware Soak

permissions:
  contents: read

# Do not allow two runs of this workflow against the same selected VISA resource.
concurrency:
  group: dpo4000-soak-${{ inputs.visa_resource }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      authorized_bench:
        description: "I explicitly authorize this reserved DPO4054 for a continuous read-only qualification"
        required: true
        type: boolean
        default: false
      visa_resource:
        description: "VISA resource for the oscilloscope"
        required: true
        default: "USB0::0x0699::0x0401::C011280::INSTR"
      duration_hours:
        description: "Qualification duration"
        required: true
        type: choice
        options:
          - "24"
          - "72"
        default: "24"
      interval_seconds:
        description: "Seconds between read-only cycles"
        required: true
        default: "10"
      max_failures:
        description: "Maximum tolerated failed cycles"
        required: true
        default: "10"
      max_rss_growth_mib:
        description: "Maximum allowed process RSS growth"
        required: true
        default: "256"

jobs:
  soak:
    name: DPO4000 ${{ inputs.duration_hours }}h soak
    if: ${{ inputs.authorized_bench }}
    runs-on: [self-hosted, dpo4000]
    timeout-minutes: 4440

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install driver with pinned runtime dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c constraints-release.txt -e .

      - name: Fail fast on software qualification smoke
        run: |
          python -m pip install -c constraints-release.txt -e .[dev]
          python -m pytest -q tests/test_p0_qualification_guards.py
          python -m ruff check scripts/run_hardware_soak.py scripts/validate_soak_report.py

      - name: Run long-duration read-only qualification
        id: soak
        shell: bash
        run: |
          python scripts/run_hardware_soak.py \
            --resource "${{ inputs.visa_resource }}" \
            --duration-hours "${{ inputs.duration_hours }}" \
            --interval-seconds "${{ inputs.interval_seconds }}" \
            --max-failures "${{ inputs.max_failures }}" \
            --max-rss-growth-mib "${{ inputs.max_rss_growth_mib }}" \
            --output-dir "hardware_verification_reports/soak-${{ inputs.duration_hours }}h-${{ github.run_number }}"

      - name: Independently validate final soak evidence
        if: always()
        shell: bash
        run: |
          python scripts/validate_soak_report.py \
            --report-dir "hardware_verification_reports/soak-${{ inputs.duration_hours }}h-${{ github.run_number }}" \
            --min-hours "${{ inputs.duration_hours }}" \
            --expected-commit "${{ github.sha }}"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dpo4000-soak-${{ inputs.duration_hours }}h-${{ github.run_number }}
          path: hardware_verification_reports/
          if-no-files-found: error
          retention-days: 90
