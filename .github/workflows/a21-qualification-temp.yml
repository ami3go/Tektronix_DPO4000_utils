name: A21 Hardware Qualification (temporary)

on:
  push:
    branches: [a21-scientific-export]

permissions:
  contents: read

env:
  DPO4000_HARDWARE: "1"
  DPO4000_RESOURCE: "TCPIP0::192.168.0.5::INSTR"
  DPO4000_EXPECT_IDN: "TEKTRONIX,DPO4054"
  DPO4000_TIMEOUT_MS: "20000"

jobs:
  qualification:
    name: A21 DPO4054 scientific export qualification
    if: github.repository == 'ami3go/Tektronix_DPO4000_utils'
    runs-on: [self-hosted, dpo4000]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,scientific]
      - name: Recheck focused A21 software contracts
        run: |
          pytest -q \
            tests/test_a21_scientific_export.py \
            tests/test_a21_scientific_export_safety.py \
            tests/test_a21_scientific_export_gui_contract.py
      - name: Run A21 1M scaling benchmark
        run: |
          python scripts/benchmark_a21_export.py \
            --sizes 1000,10000,100000,1000000 \
            --formats npz,dpoz \
            --output a21-benchmark.json
      - name: Run DPO4054 waveform export/import qualification
        run: |
          pytest -q -m hardware \
            tests/hardware/test_a21_scientific_export_hardware.py \
            --junitxml=a21-hardware-junit.xml
      - name: Upload A21 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21-dpo4054-qualification-${{ github.run_id }}
          path: |
            a21-benchmark.json
            a21-hardware-junit.xml
          if-no-files-found: warn
