name: Hardware API Tests

permissions:
  contents: read

# One physical bench, including alternate USB/TCPIP resource aliases.
concurrency:
  group: dpo4000-physical-bench
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      visa_resource:
        description: "VISA resource for the oscilloscope"
        required: true
        default: ""
      expected_idn:
        description: "Exact DPO4054 *IDN? including instrument serial; required for all write-capable profiles"
        required: false
        default: ""
      authorized_readonly:
        description: "Bench owner separately approves strict query-only HIL"
        type: boolean
        required: true
        default: false
      expected_serial:
        description: "Exact DPO4054 serial read independently from *IDN?"
        required: true
        default: ""
      verified_options:
        description: "Operator verified option inventory, or NONE"
        required: true
        default: ""
      ch1_probe_comp_confirmed:
        description: "Operator confirms CH1 connected to Probe Comp"
        type: boolean
        required: true
        default: false
      authorized_bench:
        description: "Bench owner authorizes access to this reserved scope, including read-only discovery"
        required: true
        type: boolean
        default: false
      profile:
        description: "Hardware verification safety profile"
        required: true
        type: choice
        options:
          - read-only
          - reversible
          - full
        default: read-only
      authorized_reversible:
        description: "Bench owner explicitly authorizes reversible instrument writes"
        type: boolean
        required: true
        default: false
      authorized_disruptive:
        description: "Separate physical bench approval for full/disruptive profile"
        type: boolean
        required: true
        default: false
      test_channel:
        description: "Analog channel used by qualification checks"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"
      waveform_points:
        description: "Structured binary waveform points"
        required: true
        default: "1000"
      artifact_record_length:
        description: "Temporary maximum record length for legacy CSV evidence"
        required: true
        default: "1000"
      allow_reference_overwrite:
        description: "Allow full profile to overwrite a disposable REF waveform"
        required: true
        type: boolean
        default: false
      reference_destination:
        description: "Disposable REF destination when overwrite is enabled"
        required: true
        type: choice
        options:
          - "none"
          - "1"
          - "2"
          - "3"
          - "4"
        default: "none"

jobs:
  hardware-api:
    name: DPO4000 full hardware verification
    runs-on: [self-hosted, dpo4000]
    timeout-minutes: 45

    env:
      DPO4000_HARDWARE: "1"
      DPO4000_RESOURCE: ${{ inputs.visa_resource }}
      DPO4000_EXPECT_IDN: ${{ inputs.expected_idn }}
      DPO4000_ENABLE_WRITE_TESTS: ${{ inputs.profile != 'read-only' }}
      DPO4000_TEST_CHANNEL: ${{ inputs.test_channel }}
      DPO4000_WAVEFORM_POINTS: ${{ inputs.waveform_points }}
      DPO4000_EXPECT_SERIAL: ${{ inputs.expected_serial }}
      DPO4000_READONLY_AUTHORIZED: ${{ inputs.authorized_readonly == true && '1' || '0' }}
      DPO4000_PROBE_COMP_CONFIRMED: ${{ inputs.ch1_probe_comp_confirmed == true && '1' || '0' }}
      DPO4000_EVIDENCE_DIR: hardware_verification_reports/github-actions

    steps:
      - name: Verify profile-specific bench authorization
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          BENCH_APPROVED: ${{ inputs.authorized_bench }}
          TARGET_IDN: ${{ inputs.expected_idn }}
          REVERSIBLE: ${{ inputs.authorized_reversible }}
          DISRUPTIVE: ${{ inputs.authorized_disruptive }}
          REF_OVERWRITE: ${{ inputs.allow_reference_overwrite }}
          REF_DEST: ${{ inputs.reference_destination }}
          READONLY_AUTHORIZED: ${{ inputs.authorized_readonly }}
          SERIAL: ${{ inputs.expected_serial }}
          VERIFIED_OPTIONS: ${{ inputs.verified_options }}
          VISA_RESOURCE: ${{ inputs.visa_resource }}
        run: |
          if [[ -z "${VISA_RESOURCE// /}" ]]; then
            echo "::error::An operator-supplied VISA resource is required."
            exit 1
          fi
          if [[ "$PROFILE" == "read-only" && ( "$READONLY_AUTHORIZED" != "true" || -z "${SERIAL// /}" || -z "${VERIFIED_OPTIONS// /}" ) ]]; then
            echo "::error::Strict read-only HIL requires separate authorization, exact serial and option inventory."
            exit 1
          fi
          if [[ "$BENCH_APPROVED" != "true" ]]; then
            echo "::error::Explicit bench reservation authorization required."
            exit 1
          fi
          if [[ "$PROFILE" != "read-only" && "$TARGET_IDN" != *"DPO4054"* ]]; then
            echo "::error::Write-capable HIL requires an exact approved DPO4054 serial IDN."
            exit 1
          fi
          if [[ "$PROFILE" != "read-only" && "$REVERSIBLE" != "true" ]]; then
            echo "::error::Reversible configuration writes require explicit authorization."
            exit 1
          fi
          if [[ "$PROFILE" == "full" && "$DISRUPTIVE" != "true" ]]; then
            echo "::error::Full/disruptive profile requires a separate authorization."
            exit 1
          fi
          if [[ "$REF_OVERWRITE" == "true" && "$PROFILE" != "full" ]]; then
            echo "::error::REF overwrite requires separately authorized full profile."
            exit 1
          fi
          if [[ "$REF_OVERWRITE" == "true" && "$REF_DEST" == "none" ]]; then
            echo "::error::Explicit disposable REF slot required; no default destination."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Show VISA environment
        run: |
          python - <<'PY'
          import os
          from dpo4000_utils import list_visa_resources

          print("DPO4000_RESOURCE=", os.environ.get("DPO4000_RESOURCE"))
          print("DPO4000_EXPECT_IDN=", os.environ.get("DPO4000_EXPECT_IDN"))
          print("DPO4000_ENABLE_WRITE_TESTS=", os.environ.get("DPO4000_ENABLE_WRITE_TESTS"))
          print("Visible VISA resources:")
          for resource in list_visa_resources():
              print("  ", resource)
          PY

      - name: Run full public API verifier
        id: verifier
        continue-on-error: true
        run: |
          args=(
            --resource "${{ inputs.visa_resource }}"
            --profile "${{ inputs.profile }}"
            --expected-idn "${{ inputs.expected_idn }}"
            --test-channel "${{ inputs.test_channel }}"
            --waveform-points "${{ inputs.waveform_points }}"
            --artifact-record-length "${{ inputs.artifact_record_length }}"
            --output-dir hardware_verification_reports/github-actions
          )
          if [[ "${{ inputs.profile }}" == "read-only" ]]; then
            args+=(--authorize-read-only --expected-serial "$DPO4000_EXPECT_SERIAL" --verified-options "${{ inputs.verified_options }}")
          fi
          if [[ "${{ inputs.authorized_reversible }}" == "true" ]]; then
            args+=(--authorize-reversible-writes)
          fi
          if [[ "${{ inputs.authorized_disruptive }}" == "true" ]]; then
            args+=(--authorize-disruptive-tests)
          fi
          if [[ "${{ inputs.allow_reference_overwrite }}" == "true" ]]; then
            args+=(--allow-reference-overwrite)
            args+=(--reference-destination "${{ inputs.reference_destination }}")
          fi
          python scripts/run_hardware_verification.py "${args[@]}"

      - name: Run reviewed strict read-only pytest modules
        # A rejected admission, failed verifier or write-capable suite must never trigger.
        if: ${{ inputs.profile == 'read-only' && steps.verifier.outcome == 'success' }}
        env:
          DPO4000_ENABLE_WRITE_TESTS: "0"
        run: |
          mkdir -p hardware_verification_reports/github-actions
          pytest -q -m hardware \
            tests/hardware/test_a15_recipe_hardware.py \
            tests/hardware/test_a16_rule_hardware.py \
            tests/hardware/test_a20_measurement_trend_hardware.py \
            tests/hardware/test_a25_headless_job_hardware.py \
            tests/hardware/test_dpo4054_readonly_waveform_hardware.py \
            --junitxml=hardware_verification_reports/github-actions/pytest.xml

      - name: Run separately write-authorized pytest hardware suite
        if: ${{ inputs.profile != 'read-only' && steps.verifier.outcome == 'success' }}
        run: |
          mkdir -p hardware_verification_reports/github-actions
          pytest -q -m hardware tests/hardware \
            --junitxml=hardware_verification_reports/github-actions/pytest.xml

      - name: Upload hardware verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dpo4000-hardware-verification-${{ github.run_number }}
          path: hardware_verification_reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce verifier result
        if: always() && steps.verifier.outcome == 'failure'
        run: |
          echo "The full public API verifier reported failure or incomplete full-profile coverage."
          echo "Download the hardware verification artifact for Markdown/HTML/JSON diagnostics."
          exit 1
