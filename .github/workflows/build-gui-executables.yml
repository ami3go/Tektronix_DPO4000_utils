name: Build DPO4000 Desk Executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to create/update, for example v0.2.0. Leave empty for artifact-only build."
        required: false
        default: ""
      prerelease:
        description: "Mark created GitHub release as prerelease"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Release builds use one-file mode so the assets are easy to download/run.
env:
  APP_NAME: DPO4000Desk
  BUILD_MODE: onefile
  FLATPAK_RUNTIME_VERSION: "24.08"

jobs:
  build-windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Windows EXE
        shell: cmd
        run: scripts\build_windows_exe.bat

      - name: Rename Windows EXE asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Copy-Item dist\DPO4000Desk.exe release-assets\DPO4000Desk-windows.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DPO4000Desk-windows
          path: release-assets/DPO4000Desk-windows.exe
          if-no-files-found: error

  build-linux:
    name: Linux binary and packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux GUI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            ca-certificates \
            desktop-file-utils \
            dpkg-dev \
            fakeroot \
            flatpak \
            flatpak-builder \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            wget

      - name: Install Flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//${FLATPAK_RUNTIME_VERSION} org.freedesktop.Sdk//${FLATPAK_RUNTIME_VERSION}

      - name: Build Linux executable
        run: bash scripts/build_linux_executable.sh

      - name: Package Linux release formats
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          REQUIRE_FLATPAK: "1"
        run: bash scripts/package_linux_release.sh

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: DPO4000Desk-linux-packages
          path: |
            release-assets/DPO4000Desk-linux
            release-assets/dpo4000-desk_*_amd64.deb
            release-assets/DPO4000Desk-x86_64.AppImage
            release-assets/DPO4000Desk.flatpak
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: DPO4000 Desk ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          body_path: docs/releases/v0.2.0.md
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            release-assets/DPO4000Desk-windows/DPO4000Desk-windows.exe
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk-linux
            release-assets/DPO4000Desk-linux-packages/dpo4000-desk_*_amd64.deb
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk-x86_64.AppImage
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk.flatpak
