name: Build DPO4000 Desk Executables

run-name: DPO4000 Desk release build ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to create/update, for example v0.8.0. Leave empty for artifact-only build."
        required: false
        default: ""
      prerelease:
        description: "Mark created GitHub release as prerelease"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-gui-executables.yml"
      - "constraints-release.txt"
      - "dpo4000_utils/**"
      - "pyproject.toml"
      - "scripts/build_*"
      - "scripts/generate_release_checksums.py"
      - "scripts/package_linux_release.sh"
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "docs/releases/v*.md"

permissions:
  contents: read

env:
  APP_NAME: DPO4000Desk
  BUILD_MODE: onefile
  PYTHON_VERSION: "3.12"
  FLATPAK_RUNTIME_VERSION: "24.08"
  RELEASE_CONSTRAINTS: constraints-release.txt

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            tag=""
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(python - <<'PY'
          import pathlib
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
            )
            tag="v${version}"
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows ZIP
    needs: prepare
    runs-on: windows-latest
    env:
      BUILD_MODE: onedir

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned Python build dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c $env:RELEASE_CONSTRAINTS -e ".[build,pyside6]"
          python -m pip freeze | Sort-Object | Set-Content release-python-environment.txt

      - name: Check resolved build command
        shell: cmd
        env:
          BUILD_SKIP_INSTALL: "1"
        run: scripts\build_windows_exe.bat --dry-run

      - name: Build Windows application folder
        shell: cmd
        env:
          BUILD_SKIP_INSTALL: "1"
        run: scripts\build_windows_exe.bat

      - name: Smoke-test packaged Windows executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path "dist\DPO4000Desk\DPO4000Desk.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--startup-check" -PassThru
          if (-not $process.WaitForExit(15000)) {
            $process.Kill()
            throw "Packaged Windows startup check timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows startup check failed with exit code $($process.ExitCode)."
          }

      - name: Package Windows ZIP asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          if (-not (Test-Path dist\DPO4000Desk\DPO4000Desk.exe)) {
            Get-ChildItem -Recurse dist | Format-Table -AutoSize
            throw "Expected Windows executable missing: dist\DPO4000Desk\DPO4000Desk.exe"
          }
          Copy-Item release-python-environment.txt release-assets\release-python-environment-windows.txt
          Compress-Archive -Path dist\DPO4000Desk\* -DestinationPath release-assets\DPO4000Desk-windows.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: DPO4000Desk-windows
          path: |
            release-assets/DPO4000Desk-windows.zip
            release-assets/release-python-environment-windows.txt
          if-no-files-found: error

  build-linux:
    name: Linux binary and packages
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux GUI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            ca-certificates \
            desktop-file-utils \
            dpkg-dev \
            fakeroot \
            flatpak \
            flatpak-builder \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            wget

      - name: Install pinned Python build dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c "${RELEASE_CONSTRAINTS}" -e ".[build,pyside6]"
          python -m pip freeze | sort > release-python-environment.txt

      - name: Install Flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//${FLATPAK_RUNTIME_VERSION} org.freedesktop.Sdk//${FLATPAK_RUNTIME_VERSION}

      - name: Check resolved build command
        env:
          BUILD_SKIP_INSTALL: "1"
        run: bash scripts/build_linux_executable.sh --dry-run

      - name: Build Linux executable
        env:
          BUILD_SKIP_INSTALL: "1"
        run: bash scripts/build_linux_executable.sh

      - name: Package Linux release formats
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_tag }}
          REQUIRE_FLATPAK: "1"
        run: bash scripts/package_linux_release.sh

      - name: Smoke-test packaged Linux binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 20s ./release-assets/DPO4000Desk-linux --startup-check

      - name: Smoke-test AppImage payload
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: timeout 30s ./release-assets/DPO4000Desk-x86_64.AppImage --startup-check

      - name: Smoke-test Debian package payload
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf build/deb-smoke
          mkdir -p build/deb-smoke
          dpkg-deb -x release-assets/dpo4000-desk_*_amd64.deb build/deb-smoke
          timeout 20s build/deb-smoke/usr/bin/dpo4000-desk --startup-check

      - name: Smoke-test Flatpak bundle
        run: |
          flatpak install -y --user ./release-assets/DPO4000Desk.flatpak
          timeout 30s flatpak run --user --env=QT_QPA_PLATFORM=offscreen io.github.ami3go.DPO4000Desk --startup-check
          flatpak uninstall -y --user io.github.ami3go.DPO4000Desk

      - name: Preserve resolved Python environment
        run: cp release-python-environment.txt release-assets/release-python-environment-linux.txt

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: DPO4000Desk-linux-packages
          path: |
            release-assets/DPO4000Desk-linux
            release-assets/dpo4000-desk_*_amd64.deb
            release-assets/DPO4000Desk-x86_64.AppImage
            release-assets/DPO4000Desk.flatpak
            release-assets/release-python-environment-linux.txt
          if-no-files-found: error

  integrity:
    name: Release integrity
    needs:
      - prepare
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create integrity output directory
        run: mkdir -p release-assets/DPO4000Desk-integrity

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/DPO4000Desk-integrity/DPO4000Desk.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 manifest
        run: python scripts/generate_release_checksums.py release-assets --output release-assets/DPO4000Desk-integrity/SHA256SUMS

      - name: Verify SHA-256 manifest
        working-directory: release-assets
        run: sha256sum --check DPO4000Desk-integrity/SHA256SUMS

      - name: Attest release artifact provenance
        if: needs.prepare.outputs.release_tag != ''
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/DPO4000Desk-windows/*
            release-assets/DPO4000Desk-linux-packages/*

      - name: Attest release SBOM
        if: needs.prepare.outputs.release_tag != ''
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/DPO4000Desk-windows/*
            release-assets/DPO4000Desk-linux-packages/*
          sbom-path: release-assets/DPO4000Desk-integrity/DPO4000Desk.spdx.json

      - name: Upload release integrity metadata
        uses: actions/upload-artifact@v7
        with:
          name: DPO4000Desk-integrity
          path: |
            release-assets/DPO4000Desk-integrity/DPO4000Desk.spdx.json
            release-assets/DPO4000Desk-integrity/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - prepare
      - build-windows
      - build-linux
      - integrity
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.release_tag != ''
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Re-verify release checksums before publication
        working-directory: release-assets
        run: sha256sum --check DPO4000Desk-integrity/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: DPO4000 Desk ${{ needs.prepare.outputs.release_tag }}
          body_path: docs/releases/${{ needs.prepare.outputs.release_tag }}.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-assets/DPO4000Desk-windows/DPO4000Desk-windows.zip
            release-assets/DPO4000Desk-windows/release-python-environment-windows.txt
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk-linux
            release-assets/DPO4000Desk-linux-packages/dpo4000-desk_*_amd64.deb
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk-x86_64.AppImage
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk.flatpak
            release-assets/DPO4000Desk-linux-packages/release-python-environment-linux.txt
            release-assets/DPO4000Desk-integrity/DPO4000Desk.spdx.json
            release-assets/DPO4000Desk-integrity/SHA256SUMS
