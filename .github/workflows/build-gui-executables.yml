name: Build DPO4000 Desk Executables

run-name: >-
  DPO4000 Desk release build
  ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to create/update, for example v0.2.0. Leave empty for artifact-only build."
        required: false
        default: ""
      prerelease:
        description: "Mark created GitHub release as prerelease"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: DPO4000Desk
  BUILD_MODE: onefile
  PYTHON_VERSION: "3.12"
  FLATPAK_RUNTIME_VERSION: "24.08"

jobs:
  build-windows:
    name: Windows ZIP
    runs-on: windows-latest
    env:
      BUILD_MODE: onedir

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,pyside6]"

      - name: Check resolved build command
        shell: cmd
        env:
          BUILD_SKIP_INSTALL: "1"
        run: scripts\build_windows_exe.bat --dry-run

      - name: Build Windows application folder
        shell: cmd
        env:
          BUILD_SKIP_INSTALL: "1"
        run: scripts\build_windows_exe.bat

      - name: Package Windows ZIP asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          if (-not (Test-Path dist\DPO4000Desk\DPO4000Desk.exe)) {
            Get-ChildItem -Recurse dist | Format-Table -AutoSize
            throw "Expected Windows executable missing: dist\DPO4000Desk\DPO4000Desk.exe"
          }
          Compress-Archive -Path dist\DPO4000Desk\* -DestinationPath release-assets\DPO4000Desk-windows.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DPO4000Desk-windows
          path: release-assets/DPO4000Desk-windows.zip
          if-no-files-found: error

  build-linux:
    name: Linux binary and packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux GUI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            ca-certificates \
            desktop-file-utils \
            dpkg-dev \
            fakeroot \
            flatpak \
            flatpak-builder \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            wget

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,pyside6]"

      - name: Install Flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//${FLATPAK_RUNTIME_VERSION} org.freedesktop.Sdk//${FLATPAK_RUNTIME_VERSION}

      - name: Check resolved build command
        env:
          BUILD_SKIP_INSTALL: "1"
        run: bash scripts/build_linux_executable.sh --dry-run

      - name: Build Linux executable
        env:
          BUILD_SKIP_INSTALL: "1"
        run: bash scripts/build_linux_executable.sh

      - name: Package Linux release formats
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          REQUIRE_FLATPAK: "1"
        run: bash scripts/package_linux_release.sh

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: DPO4000Desk-linux-packages
          path: |
            release-assets/DPO4000Desk-linux
            release-assets/dpo4000-desk_*_amd64.deb
            release-assets/DPO4000Desk-x86_64.AppImage
            release-assets/DPO4000Desk.flatpak
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: DPO4000 Desk ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          body_path: docs/releases/v0.2.0.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-assets/DPO4000Desk-windows/DPO4000Desk-windows.zip
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk-linux
            release-assets/DPO4000Desk-linux-packages/dpo4000-desk_*_amd64.deb
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk-x86_64.AppImage
            release-assets/DPO4000Desk-linux-packages/DPO4000Desk.flatpak
