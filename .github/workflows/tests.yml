name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Ruff
        run: ruff check dpo4000_utils tests scripts tektronix_utils.py

  pytest:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: pytest -q

  pyside6:
    name: PySide6 desktop GUI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install package and PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,pyside6]

      - name: Run full test suite with PySide6
        run: pytest -q

      - name: A22 synthetic snapshot benchmark (not hardware throughput)
        run: |
          python scripts/benchmark_a22_live_stream.py \
            --sizes 1000,10000,100000,1000000 \
            --iterations 5 \
            --output a22-synthetic-benchmark.json

      - name: Retain A22 software-only performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a22-hosted-synthetic-benchmark
          path: a22-synthetic-benchmark.json
          if-no-files-found: warn
