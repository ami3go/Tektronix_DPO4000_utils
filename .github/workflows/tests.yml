name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Ruff
        run: ruff check dpo4000_utils tests scripts tektronix_utils.py

  pytest:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: pytest -q

      - name: A25 installed CLI no-VISA smoke and deterministic report
        if: matrix.python-version == '3.12'
        run: |
          dpo4000-job --help
          dpo4000-job --recipe tests/data/a15_recipe_minimal.json --validate-only --report a25-validate-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("a25-validate-report.json").read_text(encoding="utf-8"))
          assert data["schema"] == "dpo4000-headless-job"
          assert data["exit_code"] == 0 and data["validation_only"] is True
          PY

      - name: A25 synthetic benchmark smoke
        if: matrix.python-version == '3.12'
        run: |
          python scripts/benchmark_a25_job_runner.py --steps 1,100,1000 --repetitions 3 --output a25-benchmark.json

  pyside6:
    name: PySide6 desktop GUI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install package and PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,pyside6]

      - name: Run full test suite with PySide6
        run: pytest -q
