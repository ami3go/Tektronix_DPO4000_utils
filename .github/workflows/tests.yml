name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Ruff
        run: ruff check dpo4000_utils tests scripts tektronix_utils.py

  pytest:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: pytest -q

      - name: A25 installed CLI no-VISA smoke and deterministic report
        if: matrix.python-version == '3.12'
        run: |
          dpo4000-job --help
          dpo4000-job --recipe tests/data/a15_recipe_minimal.json --validate-only --report a25-validate-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("a25-validate-report.json").read_text(encoding="utf-8"))
          assert data["schema"] == "dpo4000-headless-job"
          assert data["exit_code"] == 0 and data["validation_only"] is True
          PY

      - name: A25 synthetic benchmark smoke
        if: matrix.python-version == '3.12'
        run: |
          python scripts/benchmark_a25_job_runner.py --steps 1,100,1000 --repetitions 3 --output a25-benchmark.json

  windows:
    name: Core Python 3.12 on Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: pytest -q

  pyside6:
    name: PySide6 desktop GUI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install package and PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,pyside6]

      - name: Run full test suite with PySide6
        run: pytest -q

  r0_offline_batch:
    name: Offline R0 regression and benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run complete software regression batch without hardware
        run: |
          mkdir -p ci-evidence
          timeout 240s python scripts/run_regression_batch.py \
            --hardware skip --all-tests --summary ci-evidence/r0-regression.json

      - name: Benchmark A18 evidence creation and verification (synthetic)
        run: timeout 240s python scripts/benchmark_a18_evidence.py --output ci-evidence/a18-benchmark.json

      - name: Benchmark A20 in-memory trends (synthetic)
        run: timeout 240s python scripts/benchmark_a20_trends.py --output ci-evidence/a20-benchmark.json

      - name: Benchmark A21 scientific export roundtrip (synthetic)
        run: timeout 240s python scripts/benchmark_a21_export.py --output ci-evidence/a21-benchmark.json

      - name: Benchmark A25 fake-session headless CLI (synthetic)
        run: timeout 240s python scripts/benchmark_a25_job_runner.py --output ci-evidence/a25-benchmark.json

      - name: Upload offline qualification outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dpo4000-offline-regression-benchmarks
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: A22 synthetic snapshot benchmark (not hardware throughput)
        run: |
          python scripts/benchmark_a22_live_stream.py \
            --sizes 1000,10000,100000,1000000 \
            --iterations 5 \
            --output a22-synthetic-benchmark.json

      - name: Retain A22 software-only performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a22-hosted-synthetic-benchmark
          path: a22-synthetic-benchmark.json
          if-no-files-found: warn
