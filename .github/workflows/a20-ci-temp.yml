name: A20 Software CI (temporary)

on:
  push:
    branches: [a20-measurement-trends]

permissions:
  contents: read

env:
  RELEASE_CONSTRAINTS: constraints-release.txt

jobs:
  core:
    name: A20 Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: pytest -q

  ruff:
    name: A20 Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: ruff check dpo4000_utils tests scripts tektronix_utils.py

  pyside6:
    name: A20 PySide6 desktop GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,pyside6]
      - env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  benchmark:
    name: A20 trend benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: python scripts/benchmark_a20_trends.py --sizes 1000,10000,100000 --repetitions 1 --output a20-trend-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: a20-trend-benchmark-smoke
          path: a20-trend-benchmark.json

  linux-package:
    name: A20 Linux Desk smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c "${RELEASE_CONSTRAINTS}" -e ".[build,pyside6,scientific]"
      - env:
          BUILD_SKIP_INSTALL: "1"
        run: bash scripts/build_linux_executable.sh
      - env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 20s ./dist/DPO4000Desk/DPO4000Desk --startup-check

  windows-package:
    name: A20 Windows Desk smoke build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c $env:RELEASE_CONSTRAINTS -e ".[build,pyside6,scientific]"
      - shell: cmd
        env:
          BUILD_SKIP_INSTALL: "1"
        run: scripts\build_windows_exe.bat
      - name: Smoke-test packaged executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path "dist\DPO4000Desk\DPO4000Desk.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--startup-check" -PassThru
          if (-not $process.WaitForExit(15000)) {
            $process.Kill()
            throw "Packaged Windows startup check timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows startup check failed with exit code $($process.ExitCode)."
          }
