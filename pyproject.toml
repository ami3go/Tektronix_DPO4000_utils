[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo4000-utils"
version = "0.6.14"
description = "Python driver and PySide6 DPO4000 Desk GUI for Tektronix DPO4000/DPO4054 oscilloscopes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyvisa",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.16,<0.17",
    "tomli>=2; python_version < '3.11'",
]
build = [
    "pyinstaller",
]
pyside6 = [
    "PySide6>=6.7",
]

[project.scripts]
dpo4000-desk = "dpo4000_utils.gui_qt.runner:main"

[tool.setuptools]
py-modules = ["tektronix_utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpo4000_utils*"]

[tool.setuptools.package-data]
"dpo4000_utils.gui" = ["*.ico", "*.png"]
"dpo4000_utils.gui_qt" = ["*.qss"]

[tool.pytest.ini_options]
markers = [
    "hardware: tests that require a connected Tektronix DPO4000-family oscilloscope",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly because Ruff's default rule set is not stable across releases:
# the same code reported 0 findings under one version's defaults and 153 under a
# later one. Pinning the rules here keeps CI and local runs in agreement.
# Still off, with current counts: ARG (61) and RUF (64), neither triaged yet.
[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E4", "E7", "E9", "E501",  # pycodestyle errors, including line length
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # visaResourceAddr is a deliberate compatibility alias for older scripts;
    # connection.py documents it as such and renaming it would be an API break.
    "N816",
    # VerificationSkip signals a skipped verification case, not a failure. An
    # Error suffix would misdescribe it.
    "N818",
    # Output filenames, settings filenames and debug logs stamp local time on
    # purpose: the timestamp is for the person reading the file listing. Data
    # records that are not filenames do use aware UTC (see waveform.acquired_at).
    "DTZ001",
    "DTZ005",
]
