[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo4000-utils"
version = "0.6.73"
description = "Python driver and PySide6 DPO4000 Desk GUI for Tektronix DPO4000/DPO4054 oscilloscopes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyvisa", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "tomli>=2; python_version < '3.11'"]
build = ["pyinstaller"]
pyside6 = ["PySide6>=6.7"]
hil = ["pytest", "PySide6>=6.7", "picosdk"]

[project.scripts]
dpo4000-desk = "dpo4000_utils.gui_qt.runner:main"
dpo4000-log = "dpo4000_utils.logger.log_cli:main"

[tool.setuptools]
py-modules = ["tektronix_utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpo4000_utils*"]

[tool.setuptools.package-data]
"dpo4000_utils.gui" = ["*.ico", "*.png"]
"dpo4000_utils.gui_qt" = ["*.qss"]

[tool.pytest.ini_options]
markers = [
    "hardware: tests that require a connected Tektronix DPO4000-family oscilloscope",
    "gui_hil: Automation/Logger PySide6 hardware-in-the-loop tests",
    "probe_comp: GUI HIL using the oscilloscope PROBE COMP output connected to CH1",
    "pico2206b: GUI HIL using a PicoScope 2206B AWG connected to CH1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI focused on release-blocking Python correctness while legacy style debt is
# cleaned incrementally. Explicit selection also prevents Ruff-version defaults from
# silently changing the enforced policy.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Frozen pre-existing unused-import debt. These allowances must shrink as files are
# cleaned; new F401 violations elsewhere remain CI failures.
"dpo4000_utils/gui_qt/automation_measurement_window.py" = ["F401"]
"dpo4000_utils/gui_qt/automation_profiles_window.py" = ["F401"]
"dpo4000_utils/gui_qt/automation_retention_window.py" = ["F401"]
"dpo4000_utils/gui_qt/automation_trigger_bundle_window.py" = ["F401"]
"dpo4000_utils/gui_qt/automation_waveform_window.py" = ["F401"]
"tests/test_automation_profiles_review.py" = ["F401"]
"tests/test_logger_l5.py" = ["F401"]
# Intentional backwards-compatible re-export shim.
"tektronix_utils.py" = ["F403"]
