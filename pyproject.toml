[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo4000-utils"
version = "0.6.14"
description = "Python driver and PySide6 DPO4000 Desk GUI for Tektronix DPO4000/DPO4054 oscilloscopes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyvisa",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.16,<0.17",
    "tomli>=2; python_version < '3.11'",
]
build = [
    "pyinstaller",
]
pyside6 = [
    "PySide6>=6.7",
]

[project.scripts]
dpo4000-desk = "dpo4000_utils.gui_qt.runner:main"

[tool.setuptools]
py-modules = ["tektronix_utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpo4000_utils*"]

[tool.setuptools.package-data]
"dpo4000_utils.gui" = ["*.ico", "*.png"]
"dpo4000_utils.gui_qt" = ["*.qss"]

[tool.pytest.ini_options]
markers = [
    "hardware: tests that require a connected Tektronix DPO4000-family oscilloscope",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly because Ruff's default rule set is not stable across releases:
# the same code reported 0 findings under one version's defaults and 153 under a
# later one. Pinning the rules here keeps CI and local runs in agreement.
# These groups are clean today. Not yet enabled, with current counts: B (3), C4 (1),
# N (3), PTH (2), RET (3), UP (8), SIM (11), I (36), DTZ (5), ARG (61), RUF (64),
# E501 (172 - the configured line-length is not currently met).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "PIE"]
