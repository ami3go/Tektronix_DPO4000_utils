[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo4000-utils"
version = "0.1.0"
description = "Python utilities and GUI for Tektronix DPO4000/DPO4054 oscilloscopes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyvisa",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
build = [
    "pyinstaller",
]
qt = [
    "PySide6>=6.7",
]
pyside6 = [
    "PySide6>=6.7",
]

[project.scripts]
dpo4000-gui = "dpo4000_utils.gui.runner:main"
dpo4000-gui-qt = "dpo4000_utils.gui_qt.runner:main"

[tool.setuptools]
py-modules = ["tektronix_utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpo4000_utils*"]

[tool.setuptools.package-data]
"dpo4000_utils.gui" = ["*.ico", "*.png"]
"dpo4000_utils.gui_qt" = ["*.qss"]

[tool.pytest.ini_options]
markers = [
    "hardware: tests that require a connected Tektronix DPO4000-family oscilloscope",
]

[tool.ruff]
line-length = 100
target-version = "py310"
